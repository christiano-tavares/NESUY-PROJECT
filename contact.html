
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contact — NESUY Fragrance</title>
    <meta name="description" content="Contacter NESUY Fragrance.">

  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400&display=swap"
        rel="stylesheet"
    >

   
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


    <header>
        <div class="wrap">

            <a
                class="brand"
                href="index.html"
                aria-label="NESUY Fragrance, accueil"
            >
                <img src="img/logo-nesuy.png" alt="NESUY Fragrance">
            </a>

            <input
                type="checkbox"
                id="menu-toggle"
                class="menu-toggle"
                aria-label="Ouvrir le menu"
            >

            <label for="menu-toggle" class="burger">
                Menu
            </label>

            <nav aria-label="Navigation principale">
                <ul>
                    <li>
                        <a href="index.html">Accueil</a>
                    </li>

                    <li>
                        <a href="collection.html">Collection</a>
                    </li>

                    <li>
                        <a href="a-propos.html">À propos</a>
                    </li>

                    <li>
                        <a href="contact.html" aria-current="page">
                            Contact
                        </a>
                    </li>
                </ul>
            </nav>

        </div>
    </header>


 

    <main>

   
        <section class="contact">

            <div class="wrap split" style="align-items: start;">

               
                <div>

                    <h2>Nous contacter</h2>

                    <p>
                        Une question sur la collection ?
                        Écris-nous, on vous conseille selon vos goûts.
                    </p>

                    <dl>

                        <dt>Email</dt>
                        <dd>
                            <a href="mailto:nesuy.fragrance@gmail.com">
                                nesuy.fragrance@gmail.com
                            </a>
                        </dd>

                        <dt>Snapchat</dt>
                        <dd>
                            <a href="#">
                                @nesuy.fragrance
                            </a>
                        </dd>

                        <dt>Livraison</dt>
                        <dd>
                            Partout en ile-de-France.
                        </dd>

                    </dl>

                </div>


                <form
                    action="mailto:nesuy.fragrance@gmail.com"
                    method="post"
                    enctype="text/plain"
                >

                    <label>
                        Nom
                        <input name="nom" required>
                    </label>

                    <label>
                        Email
                        <input type="email" name="email" required>
                    </label>

                    <label>
                        Message
                        <textarea name="message" required></textarea>
                    </label>

                    <button class="btn" type="submit">
                        Envoyer le message
                    </button>

                </form>

            </div>

        </section>

    </main>



    <footer>

        <div class="wrap">

         
            <img src="img/logo-nesuy.png" alt="NESUY Fragrance">

           
            <p style="margin-inline: auto;">
                La niche, pour tous
            </p>

            <p style="margin: .6rem auto 0;">
                © 2026 NESUY Fragrance
            </p>

        </div>

    </footer>

</body>
</html>
